<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Custom You glassmorphic login form with Boxicons, Poppins typography, and midnight violet aesthetic.">
  <title>Login · Custom You</title>

  <!-- Google Fonts: Poppins -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Boxicons Icons -->
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">

  <!-- Main Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Script-disabled fallback -->
  <noscript>
    <style>
      .login-card {
        opacity: 1 !important;
        transform: scale(1) !important;
        animation: none !important;
      }
    </style>
  </noscript>

  <main class="viewport-wrapper">
    <!-- Glassmorphic Login Card (Themed in Custom You Obsidian & Electric Violet) -->
    <div class="login-card" id="loginCard" role="region" aria-labelledby="cardTitle">
      <!-- Top-right Close Button -->
      <button type="button" class="close-btn" id="closeBtn" aria-label="Close login dialog">
        <i class="bx bx-x" aria-hidden="true"></i>
      </button>

      <!-- Brand Logo & Title -->
      <div class="brand-header">
        <div class="logo-badge">
          <i class="bx bxs-fingerprint logo-icon" aria-hidden="true"></i>
        </div>
        <h1 id="cardTitle" class="login-title">Login</h1>
      </div>

      <!-- Validation Error Message Area -->
      <div id="validationNotice" class="validation-notice" role="alert" aria-live="polite" hidden></div>

      <!-- Login Form (Exact Structure from Tutorial) -->
      <form action="#" class="login-form" id="loginForm" novalidate>
        <!-- 1. Username / Email Input Box -->
        <div class="input-box">
          <input
            type="text"
            id="usernameInput"
            name="username"
            placeholder="Username"
            autocomplete="username"
            required
          >
          <i class="bx bxs-user" aria-hidden="true"></i>
        </div>

        <!-- 2. Password Input Box -->
        <div class="input-box">
          <input
            type="password"
            id="passwordInput"
            name="password"
            placeholder="Password"
            autocomplete="current-password"
            required
          >
          <i class="bx bxs-lock-alt" aria-hidden="true"></i>
        </div>

        <!-- 3. Remember Me & Forgot Password Row -->
        <div class="remember-forgot-box">
          <label for="remember">
            <input type="checkbox" id="remember" name="remember">
            <span>Remember me</span>
          </label>
          <a href="#forgot" class="forgot-link">Forgot password?</a>
        </div>

        <!-- 4. Login Button in Primary Theme Color -->
        <button type="submit" class="login-btn" id="loginBtn">
          Login
        </button>

        <!-- 5. Register Row -->
        <p class="register">
          Don’t have an account? <a href="#register">Register</a>
        </p>
      </form>
    </div>

    <!-- Reopen Trigger -->
    <button type="button" class="reopen-btn" id="reopenBtn" aria-label="Open login window" hidden>
      <i class="bx bx-log-in" aria-hidden="true"></i>
      <span>Sign in</span>
    </button>
  </main>

  <!-- Interactive JavaScript Behavior -->
  <script src="script.js"></script>
</body>
</html>
