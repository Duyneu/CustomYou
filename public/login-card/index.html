<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A modern glassmorphic login card built with Poppins, Boxicons, and responsive atmospheric illustration.">
  <title>Login · Welcome Back</title>

  <!-- Google Fonts: Poppins -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Boxicons Icons -->
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">

  <!-- Main Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Script-disabled fallback to ensure card remains visible -->
  <noscript>
    <style>
      .login-card {
        opacity: 1 !important;
        transform: scale(1) !important;
        animation: none !important;
      }
    </style>
  </noscript>

  <main class="viewport-wrapper">
    <!-- Glassmorphic Login Card -->
    <div class="login-card" id="loginCard" role="region" aria-labelledby="cardTitle">
      <!-- Top-right Close Button -->
      <button type="button" class="close-btn" id="closeBtn" aria-label="Close login dialog">
        <i class="bx bx-x" aria-hidden="true"></i>
      </button>

      <!-- 1. Centered White Bold Title -->
      <h1 id="cardTitle" class="login-title">Login</h1>

      <!-- Validation Error Message Area -->
      <div id="validationNotice" class="validation-notice" role="alert" aria-live="polite" hidden></div>

      <!-- Login Form -->
      <form id="loginForm" class="login-form" novalidate>
        <!-- 2. Email Field -->
        <div class="field-group">
          <label for="emailInput" class="field-label">Email</label>
          <div class="field-wrapper">
            <input
              type="email"
              id="emailInput"
              name="email"
              class="field-input"
              autocomplete="email"
              placeholder="name@domain.com"
              required
            >
            <i class="bx bx-envelope field-icon" aria-hidden="true"></i>
          </div>
        </div>

        <!-- 3. Password Field -->
        <div class="field-group">
          <label for="passwordInput" class="field-label">Password</label>
          <div class="field-wrapper">
            <input
              type="password"
              id="passwordInput"
              name="password"
              class="field-input"
              autocomplete="current-password"
              placeholder="••••••••"
              required
            >
            <i class="bx bx-lock-alt field-icon" aria-hidden="true"></i>
          </div>
        </div>

        <!-- 4. Remember Me & Forgot Password Row -->
        <div class="meta-row">
          <label class="remember-label" for="rememberMe">
            <input type="checkbox" id="rememberMe" name="remember" class="remember-checkbox">
            <span class="remember-text">Remember me</span>
          </label>
          <a href="#forgot" class="forgot-link">Forgot Password?</a>
        </div>

        <!-- 5. Full-width Login Button -->
        <button type="submit" class="login-btn" id="loginBtn">
          Login
        </button>

        <!-- 6. Centered Bottom Registration Link -->
        <p class="register-row">
          Don’t have an account? <a href="#register" class="register-link">Register</a>
        </p>
      </form>
    </div>

    <!-- Reopen Trigger (Appears smoothly when the card is closed) -->
    <button type="button" class="reopen-btn" id="reopenBtn" aria-label="Open login window" hidden>
      <i class="bx bx-user" aria-hidden="true"></i>
      <span>Sign in</span>
    </button>
  </main>

  <!-- Main JavaScript Behavior -->
  <script src="script.js"></script>
</body>
</html>
