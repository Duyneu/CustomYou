<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Custom You fluid glassmorphic login card with Apple macOS / iOS 18 optics, frosted capsules, and lit rim highlight.">
  <title>Login · Custom You</title>

  <!-- Google Fonts: Poppins -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Boxicons Icons -->
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">

  <!-- Main Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Script-disabled fallback -->
  <noscript>
    <style>
      .login-card {
        opacity: 1 !important;
        transform: scale(1) !important;
        animation: none !important;
      }
    </style>
  </noscript>

  <main class="viewport-wrapper">
    <!-- Ambient Chromatic Fluid Mesh Behind Glass (Hardware Accelerated) -->
    <div class="ambient-fluid-layer" id="ambientFluidLayer" aria-hidden="true">
      <div class="glass-orb glass-orb-1"></div>
      <div class="glass-orb glass-orb-2"></div>
      <div class="glass-orb glass-orb-center"></div>
    </div>

    <!-- Sculpted Apple macOS Glassmorphic Login Card -->
    <div class="login-card" id="loginCard" role="region" aria-labelledby="cardTitle">
      <!-- Specular Sweep Glint Overlay -->
      <div class="glass-sweep" aria-hidden="true"></div>

      <!-- Top-right Close Button -->
      <button type="button" class="close-btn" id="closeBtn" aria-label="Close login dialog">
        <i class="bx bx-x" aria-hidden="true"></i>
      </button>

      <!-- Brand Logo, Title & Security Badge -->
      <div class="brand-header">
        <div class="logo-badge">
          <i class="bx bxs-fingerprint logo-icon" aria-hidden="true"></i>
        </div>
        <div class="security-chip">
          <i class="bx bxs-shield-alt-2" aria-hidden="true"></i>
          <span>Personal Instance · AES-256</span>
        </div>
        <h1 id="cardTitle" class="login-title">Welcome Back</h1>
        <p class="login-subtitle">Sign in to your Custom You dashboard</p>
      </div>

      <!-- Validation Error Message Area -->
      <div id="validationNotice" class="validation-notice" role="alert" aria-live="polite" hidden></div>

      <!-- Login Form with Frosted Capsule Inputs -->
      <form action="#" class="login-form" id="loginForm" novalidate>
        <!-- 1. Username / Email Input Capsule -->
        <div class="input-group">
          <label for="usernameInput" class="input-label">Account or Email</label>
          <div class="input-capsule">
            <i class="bx bxs-user input-icon" aria-hidden="true"></i>
            <input
              type="text"
              id="usernameInput"
              name="username"
              placeholder="email@example.com"
              autocomplete="username"
              required
            >
          </div>
        </div>

        <!-- 2. Password Input Capsule with Toggle -->
        <div class="input-group">
          <div class="label-row">
            <label for="passwordInput" class="input-label">Password</label>
            <a href="#forgot" class="forgot-link">Forgot?</a>
          </div>
          <div class="input-capsule">
            <i class="bx bxs-lock-alt input-icon" aria-hidden="true"></i>
            <input
              type="password"
              id="passwordInput"
              name="password"
              placeholder="••••••••••••"
              autocomplete="current-password"
              required
            >
            <button type="button" class="pwd-toggle" id="pwdToggle" aria-label="Toggle password visibility">
              <i class="bx bx-show" id="pwdIcon" aria-hidden="true"></i>
            </button>
          </div>
        </div>

        <!-- 3. Remember Me Checkbox -->
        <div class="remember-row">
          <label for="remember" class="remember-label">
            <input type="checkbox" id="remember" name="remember" checked>
            <span>Stay signed in on this device</span>
          </label>
        </div>

        <!-- 4. Login Button with Specular Rim -->
        <button type="submit" class="login-btn" id="loginBtn">
          <span>Sign In to Dashboard</span>
          <i class="bx bx-right-arrow-alt btn-icon" aria-hidden="true"></i>
        </button>

        <!-- 5. Footer Microcopy -->
        <div class="card-footer-info">
          <span class="status-indicator">
            <span class="status-dot"></span>
            Online & Ready
          </span>
          <span class="instance-owner">Single-user instance</span>
        </div>
      </form>
    </div>

    <!-- Reopen Trigger -->
    <button type="button" class="reopen-btn" id="reopenBtn" aria-label="Open login window" hidden>
      <i class="bx bx-log-in" aria-hidden="true"></i>
      <span>Sign in to Custom You</span>
    </button>
  </main>

  <!-- Interactive JavaScript Behavior with Glassmorphism Freeze & State Harness -->
  <script src="script.js"></script>
</body>
</html>
